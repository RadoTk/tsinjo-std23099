<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tsinjo - Page d'accueil</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>Tsinjo - Fonds d’urgence HEI</h1>

<section>
    <h2>Faire un don</h2>
    <form th:action="@{/don}" th:object="${newDonation}" method="post">
        <fieldset>
            <legend>Identité du donateur</legend>
            <label>Nom: <input type="text" th:field="*{donor.nom}" required></label><br>
            <label>Prénom: <input type="text" th:field="*{donor.prenom}" required></label><br>
            <label>Email: <input type="email" th:field="*{donor.email}" required></label>
        </fieldset>

        <fieldset>
            <legend>Détails du paiement</legend>
            <label>Référence: <input type="text" th:field="*{payment.ref}" required></label><br>
            <label>Montant: <input type="number" step="0.01" th:field="*{payment.amount}" required></label><br>
            <label>Date: <input type="datetime-local" th:field="*{payment.date}" required></label><br>
            <label>Moyen de paiement:
                <select th:field="*{payment.paymentMethod}">
                    <option value="MobileMoney">Mobile Money</option>
                    <option value="CreditCard">Carte bancaire</option>
                    <option value="Virement">Virement</option>
                </select>
            </label>
        </fieldset>

        <input type="hidden" th:field="*{payment.status}" value="VERIFYING"/>
        <button type="submit">Envoyer le don</button>
    </form>
</section>

<hr>

<section>
    <h2>Historique des dons</h2>
    <table border="1">
        <thead>
        <tr>
            <th>Nom complet</th>
            <th>Email</th>
            <th>Référence</th>
            <th>Montant</th>
            <th>Date</th>
            <th>Moyen</th>
            <th>Statut</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="don : ${donations}">
            <td th:text="${don.donor.nom + ' ' + don.donor.prenom}"></td>
            <td th:text="${don.donor.email}"></td>
            <td th:text="${don.payment.ref}"></td>
            <td th:text="${don.payment.amount}"></td>
            <td th:text="${#dates.format(don.payment.date, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${don.payment.paymentMethod}"></td>
            <td th:text="${don.payment.status}"></td>
        </tr>
        </tbody>
    </table>
</section>

<hr>

<section>
    <h2>Historique des aides</h2>
    <table border="1">
        <thead>
        <tr>
            <th>Nom complet</th>
            <th>Email</th>
            <th>Description</th>
            <th>Référence</th>
            <th>Montant</th>
            <th>Date</th>
            <th>Moyen</th>
            <th>Statut</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="aid : ${aides}">
            <td th:text="${aid.beneficiary.nom + ' ' + aid.beneficiary.prenom}"></td>
            <td th:text="${aid.beneficiary.email}"></td>
            <td th:text="${aid.description}"></td>
            <td th:text="${aid.payment.ref}"></td>
            <td th:text="${aid.payment.amount}"></td>
            <td th:text="${#dates.format(aid.payment.date, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${aid.payment.paymentMethod}"></td>
            <td th:text="${aid.payment.status}"></td>
        </tr>
        </tbody>
    </table>
</section>

</body>
</html>
